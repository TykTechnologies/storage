version: "3"
includes:
  temporal:
    taskfile: "temporal/Taskfile.yml"
    dir: "./temporal"

env:
  TEST_TIMEOUT:
    sh: echo ${TEST_TIMEOUT:-"5m"}
  REDIS_ADDR: "localhost:6379"

tasks:
  build:
    desc: "Build the project"
    cmds:
      - go build -v ./...

  run-tests:
    desc: "Run Go tests for specified storage and database"
    cmds:
      - |
        echo "Running tests for {{.STORAGE_TYPE}} {{.DB}} {{.DB_VERSION}} "
        if [ -z "{{.STORAGE_TYPE}}" ] || [ -z "{{.DB}}" ]; then
          echo "STORAGE_TYPE and DB must be set."
          exit 1
        fi
        tags=""
        if [[ "{{.DB}}" != "none" && -n "{{.DB}}" ]]; then
          tags="-tags {{.DB}}{{.DB_VERSION}}"
        fi
        # Only iterate packages that have test files under the active build tag.
        # Packages with no tests under the current tag still get coverage via
        # -coverpkg instrumentation from other packages' test runs, but we avoid
        # generating zero-run coverage files that can contain empty lines and
        # break gocovmerge.
        for pkg in $(go list $tags -f '{{`{{`}}if or .TestGoFiles .XTestGoFiles{{`}}`}}{{`{{`}}.ImportPath{{`}}`}}{{`{{`}}end{{`}}`}}' ./{{.STORAGE_TYPE}}/...); do
          pkg_base=$(basename $pkg)
          coveragefile="${pkg_base}.cov"
          go test -failfast -timeout $TEST_TIMEOUT -race -cover -coverpkg=./{{.STORAGE_TYPE}}/... $tags -coverprofile=${coveragefile} -v ${pkg}
          if [ -f "${coveragefile}" ]; then
            mkdir -p "coverage/$(dirname ${pkg})"
            mv ${coveragefile} "coverage/${pkg}.cov"
          fi
        done

  merge-coverage:
    desc: "Merge coverage files into a single file"
    cmds:
      - |
        # Strip empty lines from coverage files before merging. Go 1.25 can write
        # them for packages with zero test runs when -coverpkg is active, which
        # causes gocovmerge's cover.ParseProfiles to fail on the empty line.
        find . -name '*.cov' -type f | while read -r f; do
          grep -v '^$' "$f" > "${f}.clean" && mv "${f}.clean" "$f" || true
        done
        find . -name '*.cov' -type f -exec gocovmerge {} + > merged-coverage.cov

  test-persistent:
    desc: "Run tests for persistent storage with specified database"
    cmds:
      - task: run-tests
        vars:
          STORAGE_TYPE: persistent
          DB: "{{.DB}}"
          DB_SETUP: "{{.DB_SETUP}}"
          DB_VERSION: "{{.DB_VERSION}}"

  test-temporal:
    desc: "Run tests for temporal storage with specified database"
    cmds:
      - task: temporal:run-tests
        vars:
          STORAGE_TYPE: temporal
          DB: "{{.DB}}"
          DB_SETUP: "{{.DB_SETUP}}"
          DB_VERSION: "{{.DB_VERSION}}"
      - mkdir -p coverage/temporal
      - cp temporal/*.cov coverage/temporal/

  test-iamauth:
    desc: "Run hermetic IAM auth unit tests (provider selection + GCP token minting against fake endpoints; no external infra)"
    cmds:
      - task: run-tests
        vars:
          STORAGE_TYPE: iamauth
          DB: "none"
          DB_VERSION: "n/a"

  test-iam:
    desc: "Run the IAM credentials-provider integration test against an auth-enabled Redis (provider consulted on connect + rotation). Skips unless TEST_IAM_REDIS_ADDR/TEST_IAM_REDIS_PASS are set."
    cmds:
      - |
        go test -failfast -timeout $TEST_TIMEOUT -race -cover \
          -coverpkg=./temporal/... -coverprofile=iam-integration.cov \
          -run TestIAMCredentialsProvider_Integration -v ./temporal/connector/
        mkdir -p coverage/temporal
        mv iam-integration.cov coverage/temporal/iam-integration.cov
