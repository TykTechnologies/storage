version: "3"

tasks:
  # Remove leftover containers from previous runs so start tasks are
  # idempotent. `docker rm -f` also frees the host ports those containers
  # were bound to (the three redis flavours all bind 6379, so they must
  # remove each other, not just their own name).
  clean-mongo:
    internal: true
    cmds:
      - docker rm -f mongo >/dev/null 2>&1 || true

  clean-postgres:
    internal: true
    cmds:
      - docker rm -f postgres >/dev/null 2>&1 || true

  clean-redis:
    internal: true
    cmds:
      - docker rm -f redis-single redis-iam redis-tls redis-cluster >/dev/null 2>&1 || true

  start-mongo:
    deps: [clean-mongo]
    cmds:
      - echo "Starting MongoDB..."
      - docker run --name mongo -d -p 27017:27017 mongo:{{.MONGO_VERSION}}

  start-postgres:
    deps: [clean-postgres]
    cmds:
      - echo "Starting PostgreSQL..."
      - docker run --name postgres -d -p 5432:5432 -e POSTGRES_USER=testuser -e POSTGRES_PASSWORD=testpass -e POSTGRES_DB=testdb postgres:{{.POSTGRES_VERSION}}

  start-redis-single:
    deps: [clean-redis]
    cmds:
      - echo "Starting Redis single instance..."
      - docker run --name redis-single -d -p 6379:6379 redis:{{.REDIS_VERSION}}

  # Cluster nodes live on 7100-7105 (INITIAL_PORT=7100) instead of the
  # grokzen default 7000: macOS ControlCenter (AirPlay Receiver) listens on
  # ports 5000 and 7000, so the defaults cannot bind on developer machines.
  # The 5000-5010 range was only used by the image's optional sentinels,
  # which no test exercises, so it is not mapped at all.
  start-redis-cluster:
    deps: [clean-redis]
    cmds:
      - echo "Starting Redis Cluster..."
      - docker run -d -p 7100-7150:7100-7150 -e IP='0.0.0.0' -e INITIAL_PORT=7100 --name redis-cluster grokzen/redis-cluster:{{.REDIS_VERSION}}
      - sleep 5 # wait for cluster to start

  start-redis-iam:
    deps: [clean-redis]
    cmds:
      - echo "Starting auth-enabled Redis (IAM credentials-provider stand-in)..."
      - docker run --name redis-iam -d -p 6379:6379 redis:{{.REDIS_VERSION}} redis-server --requirepass tokenAAA

  start-redis-TLS:
    deps: [clean-redis]
    cmds:
      - echo "Starting Redis with TLS..."
      - docker run -d --name redis-tls -p 6379:6379 -v "$(pwd)/redis_TLS:/certs" redis:{{.REDIS_VERSION}} redis-server --tls-port 6379 --port 0 --tls-cert-file /certs/cert.pem --tls-key-file /certs/key.pem --tls-ca-cert-file /certs/cert.pem
